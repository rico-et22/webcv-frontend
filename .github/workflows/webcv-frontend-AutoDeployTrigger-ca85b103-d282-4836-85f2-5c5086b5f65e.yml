name: Trigger auto deployment for webcv-frontend

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/webcv-frontend-AutoDeployTrigger-ca85b103-d282-4836-85f2-5c5086b5f65e.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write
      contents: read
      packages: write

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.WEBCVFRONTEND_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.WEBCVFRONTEND_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.WEBCVFRONTEND_AZURE_SUBSCRIPTION_ID }}
          allow-no-subscriptions: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase the repo name
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      - name: Build and push container image
        run: |
          IMAGE_TAG="ghcr.io/${{ env.REPO }}:${{ github.sha }}"
          docker build -t $IMAGE_TAG -f Dockerfile ${{ github.workspace }}
          docker push $IMAGE_TAG

      - name: Remove stale registry credentials from Container App
        run: az containerapp registry remove -n webcv-frontend -g webcv-ai --server ghcr.io || true

      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          containerAppName: webcv-frontend
          resourceGroup: webcv-ai
          imageToDeploy: ghcr.io/${{ env.REPO }}:${{ github.sha }}


